[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tone"
version = "0.1.0"
description = "A within-person, precision-weighted, circadian-adjusted HRV stress index"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
analysis = ["pandas>=2.0"]
plots = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[project.scripts]
tone = "tone.cli:main"

[tool.setuptools.packages.find]
include = ["tone*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
