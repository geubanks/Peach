<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Song Samples</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #fff;
      gap: 40px;
      padding: 40px 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .players {
      display: flex;
      gap: 60px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .player-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 40px 36px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      width: 280px;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .player-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .player-label {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .drop-zone {
      width: 100%;
      padding: 28px 16px;
      border: 2px dashed rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      text-align: center;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.5);
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .drop-zone.dragover {
      border-color: #e94560;
      background: rgba(233, 69, 96, 0.1);
    }

    .drop-zone.loaded {
      border-color: rgba(80, 220, 160, 0.5);
      background: rgba(80, 220, 160, 0.06);
    }

    .drop-zone input[type="file"] {
      display: none;
    }

    .file-name {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
      margin-top: 4px;
      word-break: break-all;
      max-width: 200px;
      min-height: 1.2em;
    }

    .controls {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
      position: relative;
    }

    .btn:active {
      transform: scale(0.93);
    }

    .btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn:disabled:active {
      transform: none;
    }

    .btn-play {
      background: linear-gradient(135deg, #e94560, #c23152);
      box-shadow: 0 4px 20px rgba(233, 69, 96, 0.4);
    }

    .btn-play:not(:disabled):hover {
      box-shadow: 0 6px 28px rgba(233, 69, 96, 0.6);
      transform: scale(1.06);
    }

    .btn-pause {
      background: linear-gradient(135deg, #533483, #3b246b);
      box-shadow: 0 4px 20px rgba(83, 52, 131, 0.4);
    }

    .btn-pause:not(:disabled):hover {
      box-shadow: 0 6px 28px rgba(83, 52, 131, 0.6);
      transform: scale(1.06);
    }

    .btn svg {
      fill: #fff;
      width: 24px;
      height: 24px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      cursor: pointer;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e94560, #533483);
      border-radius: 2px;
      transition: width 0.1s linear;
    }

    .time-display {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.4);
      font-variant-numeric: tabular-nums;
      min-height: 1em;
    }

    .status {
      font-size: 0.75rem;
      color: rgba(80, 220, 160, 0.8);
      min-height: 1em;
    }
  </style>
</head>
<body>

  <h1>Song Samples</h1>

  <div class="players">

    <div class="player-card" id="player1">
      <span class="player-label">Song A</span>

      <div class="drop-zone" id="drop1">
        Drag & drop audio here<br>or click to browse
        <input type="file" accept="audio/*" id="file1">
      </div>
      <div class="file-name" id="name1"></div>

      <div class="controls">
        <button class="btn btn-play" id="play1" disabled>
          <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
        </button>
        <button class="btn btn-pause" id="pause1" disabled>
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
        </button>
      </div>

      <div class="progress-bar" id="bar1"><div class="progress-fill" id="fill1"></div></div>
      <div class="time-display" id="time1"></div>
      <div class="status" id="status1"></div>
    </div>

    <div class="player-card" id="player2">
      <span class="player-label">Song B</span>

      <div class="drop-zone" id="drop2">
        Drag & drop audio here<br>or click to browse
        <input type="file" accept="audio/*" id="file2">
      </div>
      <div class="file-name" id="name2"></div>

      <div class="controls">
        <button class="btn btn-play" id="play2" disabled>
          <svg viewBox="0 0 24 24"><polygon points="6,3 20,12 6,21"/></svg>
        </button>
        <button class="btn btn-pause" id="pause2" disabled>
          <svg viewBox="0 0 24 24"><rect x="5" y="3" width="4" height="18"/><rect x="15" y="3" width="4" height="18"/></svg>
        </button>
      </div>

      <div class="progress-bar" id="bar2"><div class="progress-fill" id="fill2"></div></div>
      <div class="time-display" id="time2"></div>
      <div class="status" id="status2"></div>
    </div>

  </div>

  <script>
    function setupPlayer(n) {
      const dropZone = document.getElementById(`drop${n}`);
      const fileInput = document.getElementById(`file${n}`);
      const nameEl = document.getElementById(`name${n}`);
      const playBtn = document.getElementById(`play${n}`);
      const pauseBtn = document.getElementById(`pause${n}`);
      const bar = document.getElementById(`bar${n}`);
      const fill = document.getElementById(`fill${n}`);
      const timeEl = document.getElementById(`time${n}`);
      const statusEl = document.getElementById(`status${n}`);

      let audio = null;

      function fmt(s) {
        const m = Math.floor(s / 60);
        const sec = Math.floor(s % 60).toString().padStart(2, '0');
        return `${m}:${sec}`;
      }

      function loadFile(file) {
        if (!file || !file.type.startsWith('audio/')) {
          statusEl.textContent = 'Please drop an audio file';
          return;
        }
        if (audio) { audio.pause(); audio = null; }

        const url = URL.createObjectURL(file);
        audio = new Audio(url);
        nameEl.textContent = file.name;
        dropZone.classList.add('loaded');
        statusEl.textContent = 'Ready';
        playBtn.disabled = false;
        pauseBtn.disabled = false;
        fill.style.width = '0%';
        timeEl.textContent = '';

        audio.addEventListener('loadedmetadata', () => {
          timeEl.textContent = `0:00 / ${fmt(audio.duration)}`;
        });

        audio.addEventListener('timeupdate', () => {
          const pct = (audio.currentTime / audio.duration) * 100;
          fill.style.width = pct + '%';
          timeEl.textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration)}`;
        });

        audio.addEventListener('ended', () => {
          statusEl.textContent = 'Finished';
          fill.style.width = '100%';
        });
      }

      // Drag and drop
      dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
      dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
      dropZone.addEventListener('drop', e => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        loadFile(e.dataTransfer.files[0]);
      });

      // Click to browse
      dropZone.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        if (fileInput.files[0]) loadFile(fileInput.files[0]);
      });

      // Play
      playBtn.addEventListener('click', () => {
        if (!audio) return;
        audio.play();
        statusEl.textContent = 'Playing';
      });

      // Pause
      pauseBtn.addEventListener('click', () => {
        if (!audio) return;
        audio.pause();
        statusEl.textContent = 'Paused';
      });

      // Seek via progress bar
      bar.addEventListener('click', e => {
        if (!audio || !audio.duration) return;
        const pct = e.offsetX / bar.offsetWidth;
        audio.currentTime = pct * audio.duration;
      });
    }

    setupPlayer(1);
    setupPlayer(2);
  </script>

</body>
</html>
